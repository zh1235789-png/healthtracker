<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HealthTracker">
<meta name="theme-color" content="#f4f6f8">
<title>HealthTracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23e8f0fe'/><text x='50' y='70' font-size='60' text-anchor='middle'>💪</text></svg>">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a2530; --sub:#6b7a89; --border:#e3e8ee;
  --accent:#1a6fd6; --accent-soft:#e3eefc;
  --p:#3b7cf0; --f:#e0a800; --c:#34b85a;
  --danger:#dc2626; --danger-bg:#fee2e2; --warn:#b45309; --warn-bg:#fef3c7; --ok:#16a34a; --ok-bg:#dcfce7;
  --track:#edf0f3; --overlay:rgba(15,21,25,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1519; --card:#1a2229; --text:#e8edf2; --sub:#8b9aa8; --border:#2a343d;
    --accent:#5a9cf5; --accent-soft:#1b2c44;
    --p:#6b9ff5; --f:#f0c040; --c:#5fd07f;
    --danger:#f87171; --danger-bg:#3d1a1a; --warn:#fbbf24; --warn-bg:#3a2e10; --ok:#4ade80; --ok-bg:#0f2e1c;
    --track:#26313a; --overlay:rgba(0,0,0,.6);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;width:100%}
textarea{resize:vertical;min-height:80px;line-height:1.5}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(70px + env(safe-area-inset-bottom));font-size:15px}
header{background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:22px;font-weight:800}
header .sub{color:var(--sub);font-size:12px}
main{padding:14px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sub{color:var(--sub);font-size:12px;line-height:1.5}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:700;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--accent-soft);color:var(--accent)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-block;white-space:nowrap;flex:none}
.btn:disabled{opacity:.45}
.link{color:var(--accent);font-weight:600;font-size:14px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--sub)}
.icon-btn:active{background:var(--track)}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.types{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px}
.types button{width:40px;height:34px;border-radius:9px;font-size:17px;opacity:.5}
.types button.on{background:var(--accent);opacity:1}
.datebar{display:flex;align-items:center;justify-content:space-between}
.datebar button{width:40px;height:40px;font-size:20px;color:var(--accent)}
.datebar .d{text-align:center}
.datebar .d b{font-size:18px}
.today-tag{color:var(--accent);font-size:13px;font-weight:700;margin-left:6px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px}
.bar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:6px}
.pfc-row{margin-top:12px}
.pfc-row .num b{font-size:17px}
.over{color:var(--danger)!important}
.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px;font-size:13px;font-weight:700;color:var(--sub)}
.group-h .t{font-size:12px;color:var(--text);font-weight:600}
.item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px 12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.item .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--track);color:var(--sub);margin-left:4px;vertical-align:middle}
.cp{color:var(--p)} .cf{color:var(--f)} .cc{color:var(--c)}
.empty{text-align:center;color:var(--sub);padding:24px 8px;font-size:14px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.comment{white-space:pre-wrap;line-height:1.6;font-size:14px}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--track);border-radius:12px;padding:10px}
.stat .k{font-size:11px;color:var(--sub)} .stat .v{font-size:18px;font-weight:800;margin-top:2px}
.down{color:var(--ok)} .up{color:var(--danger)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chips button{padding:6px 12px;border-radius:999px;background:var(--track);font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap}
.chips button.on{background:var(--accent);color:#fff}
.pick{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:6px;background:var(--card)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:8px;background:var(--track);font-weight:800}
.qty span{min-width:30px;text-align:center;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
nav button .i{font-size:20px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--accent)}
nav button.on .i{filter:none;opacity:1}
nav a.navlink{flex:1;padding:8px 0 7px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;text-decoration:none}
nav a.navlink .i{font-size:20px}
#sheet{position:fixed;inset:0;background:var(--overlay);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
#sheet .ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
#sheet .ph h3{font-size:17px}
#sheet .pb{overflow-y:auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
svg text{font-family:inherit}
.step{display:flex;gap:8px;align-items:flex-start;margin:12px 0 6px;font-weight:700;font-size:14px}
.step .n{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.est{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card)}
.est input{padding:7px 8px;font-size:16px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--border)}
.hist:last-child{border-bottom:none}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"><div class="panel"><div class="ph"><h3 id="sheetTitle"></h3><button class="icon-btn" data-a="closeSheet" aria-label="閉じる">✕</button></div><div class="pb" id="sheetBody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// ===== 定数 =====
const KEY = 'hmt_v1';
const TYPES = {
  training:{label:'トレーニング',short:'筋トレ',icon:'🏋️'},
  cardio:{label:'有酸素',short:'有酸素',icon:'🏃'},
  both:{label:'両方（トレ＋有酸素）',short:'両方',icon:'🔥'},
  rest:{label:'休息',short:'休息',icon:'🌙'},
};
const TYPE_KEYS = ['training','cardio','both','rest'];
const TIMINGS = [['breakfast','朝食'],['lunch','昼食'],['dinner','夕食'],['snack','補食'],['snack_pre','補食（トレ前）'],['snack_post','補食（トレ後）']];
const TIMING_LABEL = Object.fromEntries(TIMINGS);
const CATS = ['食材','外食','市販','サプリ'];
const WD = ['日','月','火','水','木','金','土'];
const COACH_URL = 'https://zh1235789-png.github.io/workout-ai-coach/';

const DEFAULT_PROFILE = {
  heightCm:170, weightGoalKg:70, bfGoalPct:15,
  kcal:{training:2300, cardio:2300, both:2500, rest:2100},
  pfc:{training:{p:28,f:25,c:47}, cardio:{p:28,f:25,c:47}, both:{p:27,f:24,c:49}, rest:{p:30,f:26,c:44}},
};
const DEFAULT_PRESETS = [
  ['白米','100g',100,168,2.5,0.3,37,'食材'],['鶏胸肉（皮なし）','100g',100,108,23,1.2,0,'食材'],['卵','1個',50,76,6.2,5.2,0.2,'食材'],
  ['ブロッコリー','100g',100,33,3.5,0.5,4,'食材'],['納豆','1パック',45,90,7.4,4.5,5.4,'食材'],['豆腐（木綿）','100g',100,56,4.9,3,1.6,'食材'],
  ['サーモン','100g',100,138,20,6,0,'食材'],['バナナ','1本',100,86,1.1,0.2,22.5,'食材'],
  ['ホエイプロテイン','1杯',30,120,24,2,3,'サプリ'],['EAA','1杯',10,40,10,0,0,'サプリ'],
].map((a,i)=>({id:uid(),name:a[0],unitLabel:a[1],unitG:a[2],kcal:a[3],p:a[4],f:a[5],c:a[6],category:a[7],supp:a[7]==='サプリ',inc:true,order:i}));

// ===== ユーティリティ =====
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function ds(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return ds(new Date()); }
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return ds(d); }
function jpDate(s){ const d=pd(s); return `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`; }
function r1(n){ return Math.round(n*10)/10; }
function num(v,def=0){ const n=parseFloat(String(v).replace(/[^\d.\-]/g,'')); return isFinite(n)?n:def; }
function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function sign(n,d=1){ const v=n.toFixed(d); return (n>0?'+':'')+v; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function avg(a){ return a.length? a.reduce((x,y)=>x+y,0)/a.length : null; }

// ===== 保存 =====
let db = load();
function load(){
  let o=null;
  try{ o=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!o) o={};
  o.profile = Object.assign(structuredClone(DEFAULT_PROFILE), o.profile||{});
  o.presets = o.presets || DEFAULT_PRESETS;
  o.sets = o.sets || [];
  o.meals = o.meals || [];
  o.weights = o.weights || [];
  o.training = o.training || {};
  o.comments = o.comments || {};
  o.meta = o.meta || {};
  return o;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('保存に失敗しました（端末の空き容量やプライベートモードを確認してください）'); }
}

// ===== 計算 =====
function dayType(date){ return db.training[date] || null; }
function effType(date){ return dayType(date) || 'training'; }
function targets(date){
  const t=effType(date), kcal=db.profile.kcal[t], r=db.profile.pfc[t];
  return {type:t, kcal, p:kcal*r.p/100/4, f:kcal*r.f/100/9, c:kcal*r.c/100/4};
}
function mealsOn(date){ return db.meals.filter(m=>m.date===date); }
function sumMeals(list){
  const s={kcal:0,p:0,f:0,c:0};
  for(const m of list){ if(m.inc===false) continue; s.kcal+=m.kcal; s.p+=m.p; s.f+=m.f; s.c+=m.c; }
  return s;
}
// 体重のある記録だけ（体脂肪率だけの日は除く）
function sortedWeights(){ return db.weights.filter(w=>w.kg!=null).sort((a,b)=>a.date<b.date?-1:1); }
function sortedFats(){ return db.weights.filter(w=>w.fat!=null).sort((a,b)=>a.date<b.date?-1:1); }
function avgBetween(ws, from, to){ return avg(ws.filter(w=>w.date>=from && w.date<=to).map(w=>w.kg)); }

// ===== 画面状態 =====
const state = { tab:'today', date:todayStr(), wRange:30, foodTab:'preset', foodCat:'すべて', trainerOpen:false };

// ===== 描画 =====
function render(){
  renderNav();
  const fn = {today:renderToday, weight:renderWeight, food:renderFood, settings:renderSettings}[state.tab];
  fn();
}
function renderNav(){
  const items=[['today','🏠','Today'],['weight','⚖️','体重'],['food','🍽️','食事'],['settings','⚙️','設定']];
  // 運動の記録は筋トレAIコーチ側で行う（別アプリへのリンク）
  document.getElementById('nav').innerHTML = items.map(([k,i,l])=>`<button class="${state.tab===k?'on':''}" data-a="tab" data-v="${k}"><span class="i">${i}</span>${l}</button>`).join('')
    + `<a href="${COACH_URL}" target="_blank" rel="noopener" class="navlink"><span class="i">🏋️</span>コーチ↗</a>`;
}
function setHeader(title, sub, right=''){
  document.getElementById('hdr').innerHTML = `<div><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:''}</div>${right}`;
}

// ----- Today -----
function renderToday(){
  const date=state.date, dt=dayType(date), tg=targets(date);
  const typeBtns = `<div class="types">${TYPE_KEYS.map(k=>`<button class="${dt===k?'on':''}" data-a="setType" data-v="${k}" title="${TYPES[k].label}の日の目標" aria-label="${TYPES[k].label}の日の目標">${TYPES[k].icon}</button>`).join('')}</div>`;
  setHeader('Today', jpDate(todayStr()), typeBtns);

  const meals=mealsOn(date), s=sumMeals(meals);
  const remain=tg.kcal-s.kcal, pct=Math.min(100, s.kcal/tg.kcal*100);
  const isToday = date===todayStr();
  const typeLabel = dt ? `目標：${TYPES[dt].label}の日` : '目標：未選択（トレーニング日で計算）';

  let html = `
  <div class="card datebar">
    <button data-a="shiftDate" data-v="-1" aria-label="前の日">‹</button>
    <div class="d"><div class="sub">日付</div><b>${jpDate(date)}</b>${isToday?'<span class="today-tag">今日</span>':`<button class="today-tag" data-a="goToday">今日へ</button>`}</div>
    <button data-a="shiftDate" data-v="1" aria-label="次の日">›</button>
  </div>`;

  // タンパク質アラート（夕方以降に目標の60%未満）
  if(isToday && new Date().getHours()>=18 && s.p < tg.p*0.6){
    html += `<div class="alert">⚠️ タンパク質が目標の${Math.round(s.p/tg.p*100)}%です。あと${Math.round(tg.p-s.p)}g 必要です。</div>`;
  }

  html += `
  <div class="card">
    <div class="between"><b>カロリー</b><span class="sub">${esc(typeLabel)}</span></div>
    <div class="between" style="align-items:flex-end;margin-top:6px">
      <div><span class="big">${fmt(s.kcal)}</span><span class="sub" style="font-size:15px"> / ${fmt(tg.kcal)} kcal</span></div>
      <div style="text-align:right"><div class="sub">${remain>=0?'残り':'超過'}</div><div style="font-size:22px;font-weight:800;color:${remain>=0?'var(--accent)':'var(--danger)'}">${fmt(Math.abs(remain))} kcal</div></div>
    </div>
    <div class="bar"><i style="width:${pct}%;background:${remain>=0?'var(--accent)':'var(--danger)'}"></i></div>
  </div>
  <div class="card">
    <div class="between"><b style="font-size:14px">タンパク質・脂質・炭水化物</b><span class="sub">実績 / 目標</span></div>
    ${pfcRow('P','タンパク質',s.p,tg.p,'--p')}
    ${pfcRow('F','脂質',s.f,tg.f,'--f')}
    ${pfcRow('C','炭水化物',s.c,tg.c,'--c')}
  </div>`;

  html += `<div class="between" style="margin:18px 2px 0"><b style="font-size:18px">食事ログ</b>
    <div class="row"><button class="link" data-a="saveSet">⧉ セット保存</button><button class="link" data-a="addMeal" style="margin-left:10px">＋ 追加</button></div></div>`;
  if(!meals.length){
    html += `<div class="empty">食事が登録されていません<br><br><button class="btn btn-primary btn-sm" data-a="addMeal">＋ 食事を追加</button></div>`;
  }
  for(const [k,label] of TIMINGS){
    const g=meals.filter(m=>m.timing===k); if(!g.length) continue;
    const gs=sumMeals(g);
    html += `<div class="group-h"><span>${label}</span><span class="t">${fmt(gs.kcal)} kcal <span class="cp">P${Math.round(gs.p)}g</span> <span class="cf">F${Math.round(gs.f)}g</span> <span class="cc">C${Math.round(gs.c)}g</span></span></div>`;
    html += g.map(mealItem).join('');
  }
  html += `<div style="height:8px"></div>` + trainerCard(date);
  document.getElementById('app').innerHTML = html;
}
function pfcRow(k,label,v,t,color){
  const over=v>t, pct=Math.min(100,v/t*100);
  return `<div class="pfc-row"><div class="between"><span>${k} ${label}</span><span class="num"><b style="color:var(${color})">${Math.round(v)}g</b><span class="sub"> / ${Math.round(t)}g ${over?`<span class="over">超過${Math.round(v-t)}g</span>`:`残${Math.round(t-v)}g`}</span></span></div>
  <div class="bar"><i style="width:${pct}%;background:var(${color})"></i></div></div>`;
}
function mealItem(m){
  return `<div class="item"><div class="grow"><div class="name">${esc(m.name)}${m.inc===false?'<span class="tag">除外</span>':''}</div>
    <div class="meta">${fmt(m.kcal)} kcal · <span class="cp">P${r1(m.p)}</span> <span class="cf">F${r1(m.f)}</span> <span class="cc">C${r1(m.c)}</span></div></div>
    <button class="icon-btn" data-a="mealToPreset" data-id="${m.id}" aria-label="プリセットに保存">🔖</button>

function fatStat(){
  const fs=sortedFats(), last=fs[fs.length-1], goal=db.profile.bfGoalPct;
  if(!last) return `<div class="stat"><div class="k">体脂肪率（目標 ${goal}%）</div><div class="v">—</div><div class="k">測ったら体重と一緒に入力</div></div>`;
  const prev=fs.length>1?fs[fs.length-2]:null, d=prev?last.fat-prev.fat:null;
  return `<div class="stat"><div class="k">体脂肪率（${jpDate(last.date)}）</div><div class="v">${last.fat.toFixed(1)} %</div><div class="k">目標 ${goal}% ${d!=null?`／前回比 <span class="${d<0?'down':d>0?'up':''}">${sign(d)}</span>`:''}</div></div>`;
}
function fatChart(){
  const fs=sortedFats();
  if(fs.length<2) return '';
  const W=340,H=150,L=34,R=8,T=10,B=24, from=fs[0].date, span=Math.max(1,(pd(fs[fs.length-1].date)-pd(from))/86400000);
  const goal=db.profile.bfGoalPct, vals=[...fs.map(f=>f.fat),goal];
  const lo=Math.floor(Math.min(...vals)-0.5), hi=Math.ceil(Math.max(...vals)+0.5);
  const x=d=>L+(pd(d)-pd(from))/86400000/span*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  for(let v=lo; v<=hi; v+=Math.max(1,Math.round((hi-lo)/4))) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${v}</text>`;
  [fs[0], fs[fs.length-1]].forEach((f,i)=>{ const dd=pd(f.date); g+=`<text x="${x(f.date)}" y="${H-6}" font-size="10" text-anchor="${i?'end':'start'}" fill="var(--sub)">${dd.getMonth()+1}/${dd.getDate()}</text>`; });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  g+=`<polyline fill="none" stroke="var(--p)" stroke-width="2" points="${fs.map(f=>x(f.date)+','+y(f.fat)).join(' ')}"/>`+fs.map(f=>`<circle cx="${x(f.date)}" cy="${y(f.fat)}" r="3" fill="var(--p)"/>`).join('');
  return `<div class="card"><h2>体脂肪率の推移</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="体脂肪率グラフ">${g}</svg><div class="sub" style="margin-top:6px"><span style="color:var(--ok)">┅</span> 目標 ${goal}%</div></div>`;
}
function weightChart(ws, days, goal){
  const t=todayStr(), from=addDays(t,-(days-1));
  const pts=ws.filter(w=>w.date>=from);
  if(!pts.length) return '<div class="empty">データがありません</div>';
  const W=340,H=190,L=34,R=8,T=10,B=24;
  const x=d=>L+(pd(d)-pd(from))/86400000/(days-1||1)*(W-L-R);
  const ma=pts.map(w=>({date:w.date,v:avgBetween(ws,addDays(w.date,-6),w.date)}));
  const vals=[...pts.map(p=>p.kg),goal,...ma.map(m=>m.v)];
  let lo=Math.floor((Math.min(...vals)-0.3)*2)/2, hi=Math.ceil((Math.max(...vals)+0.3)*2)/2;
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  const step=(hi-lo)>4?1:0.5;
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${v.toFixed(step<1?1:0)}</text>`; }
  const ticks = days===7?7:days===30?5:4;
  for(let i=0;i<ticks;i++){ const d=addDays(from, Math.round(i*(days-1)/(ticks-1))); const dd=pd(d); g+=`<text x="${x(d)}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--sub)">${dd.getMonth()+1}/${dd.getDate()}</text>`; }
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ok)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="1.5" opacity=".5" points="${pts.map(p=>x(p.date)+','+y(p.kg)).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="var(--warn)" stroke-width="2.5" points="${ma.map(p=>x(p.date)+','+y(p.v)).join(' ')}"/>`;
  g+=pts.map(p=>`<circle cx="${x(p.date)}" cy="${y(p.kg)}" r="${days>30?2:3}" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="体重グラフ">${g}</svg>`;
}
function weeklyChart(ws){
  if(!ws.length) return '<div class="empty">データがありません</div>';
  const wk={};
  for(const w of ws){ const d=pd(w.date); d.setDate(d.getDate()-((d.getDay()+6)%7)); const k=ds(d); (wk[k]=wk[k]||[]).push(w.kg); }
  const keys=Object.keys(wk).sort().slice(-12), data=keys.map(k=>({k,v:avg(wk[k])}));
  const W=340,H=170,L=34,R=8,T=18,B=24;
  const vals=data.map(d=>d.v); let lo=Math.floor((Math.min(...vals)-0.3)*2)/2, hi=Math.ceil((Math.max(...vals)+0.3)*2)/2;
  const x=i=>L+(data.length===1?0.5:i/(data.length-1))*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';
  const step=(hi-lo)>4?1:0.5;
  for(let v=lo; v<=hi+1e-9; v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${L-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${v.toFixed(step<1?1:0)}</text>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${data.map((d,i)=>x(i)+','+y(d.v)).join(' ')}"/>`;
  data.forEach((d,i)=>{ const dd=pd(d.k); g+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="3.5" fill="var(--accent)"/>`; if(i%2===(data.length-1)%2) g+=`<text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--sub)">${dd.getMonth()+1}/${dd.getDate()}〜</text><text x="${x(i)}" y="${y(d.v)-8}" font-size="10" text-anchor="middle" fill="var(--text)">${d.v.toFixed(1)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="週平均体重">${g}</svg>`;
}

// ----- JSON 解析（Claudeの回答から） -----
function extractJson(text){
  const s=text.search(/[\[{]/); if(s<0) return null;
  const open=text[s], close=open==='{'?'}':']';
  let depth=0,inStr=false,escp=false;
  for(let i=s;i<text.length;i++){
    const ch=text[i];
    if(inStr){ if(escp) escp=false; else if(ch==='\\') escp=true; else if(ch==='"') inStr=false; continue; }
    if(ch==='"') inStr=true; else if(ch==='{'||ch==='[') depth++; else if(ch==='}'||ch===']'){ depth--; if(depth===0) return text.slice(s,i+1); }
  }
  return null;
}
function parseEstimate(text){
  const raw=String(text||'').trim();
  if(!raw) throw new Error('回答が空です');
  const fence=raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const cands=[fence&&fence[1], extractJson(fence?fence[1]:raw), raw].filter(Boolean);
  let obj=null;
  for(const c of cands){ for(const a of [c, c.replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,'$1')]){ try{ obj=JSON.parse(a); break; }catch(e){} } if(obj) break; }
  if(!obj) throw new Error(raw.includes('{')?'JSONとして読み取れませんでした（回答が途中で切れていないか確認してください）':'JSONが見当たりません。Claudeの回答の { から } までを貼り付けてください');
  let items = Array.isArray(obj)?obj : Array.isArray(obj.items)?obj.items : [obj];
  items = items.map(o=>({
    name: o.name||o.food_name||o.food||o.menu||'食事',
    kcal: r1(num(o.kcal??o.calories??o.energy)),
    p: r1(num(o.protein_g??o.protein??o.p)),
    f: r1(num(o.fat_g??o.fat??o.f)),
    c: r1(num(o.carb_g??o.carbs_g??o.carbohydrate_g??o.carb??o.carbs??o.c)),
  })).filter(o=>o.kcal>0||o.p>0||o.f>0||o.c>0);
  if(!items.length) throw new Error('カロリー・PFCの数値が読み取れませんでした');
  return items;
}

// ===== ヘルスケア（eufy Life → Appleヘルスケア → ショートカット）からの取り込み =====
// 受け付ける形式: "2026-09-20,77.5,17.1" を「;」か改行で区切って複数。CSV（eufy Lifeの書き出し）も可
function parseBodyRows(text){
  const rows=[];
  const lines=String(text||'').replace(/\r/g,'').split(/[;\n]+/).map(l=>l.trim()).filter(Boolean);
  let dateCol=0, kgCol=1, fatCol=2, header=false;
  const head=lines[0]&&lines[0].toLowerCase();
  if(head && /[a-z]/.test(head) && !/^\d{4}/.test(head)){
    const cols=head.split(/[,\t]/).map(c=>c.trim());
    const find=(...keys)=>cols.findIndex(c=>keys.some(k=>c.includes(k)));
    const d=find('date','時','日'), w=find('weight','体重'), f=find('fat','体脂肪');
    if(d>=0&&w>=0){ dateCol=d; kgCol=w; fatCol=f; header=true; }
  }
  for(const line of (header?lines.slice(1):lines)){
    const cols=line.split(/[,\t]/).map(c=>c.trim());
    const dm=(cols[dateCol]||'').match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    // 日付がなければ今日の記録として扱う（ショートカットを短くするため）
    const date = dm ? `${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}` : todayStr();
    const off = dm ? 0 : -1;   // 日付列がない分だけ列をずらす
    const val=i=>{ const j=i+off; if(j<0||j>=cols.length) return null; const t=cols[j].replace(/[^\d.]/g,''); return t?num(t,null):null; };
    let kg=val(kgCol), fat=val(fatCol);
    if(fat!=null && fat>0 && fat<1) fat=fat*100;   // ヘルスケアは 0.171 のような割合で返すことがある
    if(kg!=null && !(kg>20&&kg<300)) kg=null;
    if(fat!=null && !(fat>2&&fat<60)) fat=null;
    if(kg==null && fat==null) continue;
    rows.push({date, kg:kg!=null?r1(kg):null, fat:fat!=null?r1(fat):null});
  }
  return rows;
}
// 体重計の値を正とするので、同じ日の記録は上書きする
function applyBodyRows(rows){
  let add=0, upd=0, same=0;
  for(const r of rows){
    const ex=db.weights.find(w=>w.date===r.date);
    if(!ex){ db.weights.push({date:r.date, kg:r.kg, fat:r.fat}); add++; continue; }
    const before=[ex.kg,ex.fat].join();
    if(r.kg!=null) ex.kg=r.kg;
    if(r.fat!=null) ex.fat=r.fat;
    if([ex.kg,ex.fat].join()===before) same++; else upd++;
  }
  if(add||upd) save();
  return {add, upd, same};
}
function importFromHash(){
  const m=location.hash.match(/^#hc=([\s\S]+)$/);
  if(!m) return;
  let raw=m[1];
  try{ raw=decodeURIComponent(raw); }catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
  const rows=parseBodyRows(raw);
  if(!rows.length){ state.tab='weight'; toast('ヘルスケアの値を読み取れませんでした'); return; }
  const {add,upd,same}=applyBodyRows(rows);
  state.tab='weight';
  const last=rows[rows.length-1];
  toast(add||upd ? `ヘルスケアから取り込みました（${last.kg!=null?last.kg+'kg':''}${last.fat!=null?' / '+last.fat+'%':''}）` : `すでに記録済みです（${same}件）`);
}

function fromManus(o){
  const pr=o.profile||{};
  const pf=x=>x&&typeof x==='object'?{p:num(x.p),f:num(x.f),c:num(x.c)}:null;
  const profile={
    heightCm:pr.heightCm??DEFAULT_PROFILE.heightCm, weightGoalKg:pr.weightGoalKg??DEFAULT_PROFILE.weightGoalKg, bfGoalPct:pr.bfGoalPct??DEFAULT_PROFILE.bfGoalPct,
    kcal:{training:pr.calorieTraining, cardio:pr.calorieCardio, both:pr.calorieBoth??pr.calorieTraining, rest:pr.calorieRest},
    pfc:{training:pf(pr.pfcTraining), cardio:pf(pr.pfcCardio)||pf(pr.pfcTraining), both:pf(pr.pfcBoth)||pf(pr.pfcTraining), rest:pf(pr.pfcRest)},
  };
  for(const k of TYPE_KEYS){ if(!profile.kcal[k]) profile.kcal[k]=DEFAULT_PROFILE.kcal[k]; if(!profile.pfc[k]) profile.pfc[k]=DEFAULT_PROFILE.pfc[k]; }
  const item=m=>({name:m.foodName, kcal:num(m.kcal), p:num(m.proteinG), f:num(m.fatG), c:num(m.carbG), supp:!!m.isSupplement, inc:m.includeInPfc!==false});
  const training={}; for(const t of (o.training||[])) training[t.date]=t.type;
  return {
    profile,
    presets:(o.presets||[]).map((p,i)=>({id:'m'+p.id, name:p.foodName, unitLabel:p.unitLabel||'', unitG:p.unitG??null, kcal:num(p.kcalPerUnit), p:num(p.proteinG), f:num(p.fatG), c:num(p.carbG), category:CATS.includes(p.category)?p.category:'食材', supp:!!p.isSupplement, inc:p.includeInPfc!==false, order:p.sortOrder??i})),
    sets:(o.mealSets||[]).map(s=>({id:'m'+s.id, name:s.name, memo:s.description||'', items:[...(s.items||[])].sort((a,b)=>(a.sortOrder??0)-(b.sortOrder??0)).map(item)})),
    meals:(o.meals||[]).map(m=>({id:'m'+m.id, date:m.date, timing:m.mealTiming||'snack', ...item(m)})),
    weights:(o.weights||[]).map(w=>({date:w.date, kg:num(w.weightKg)})),
    training, comments:{}, meta:{importedFromManus:o.exportedAt||new Date().toISOString()},
  };
}
function importJson(text){
  const o=JSON.parse(text);
  let next;
  if(o.app==='workout-ai-coach') return importCoachBody(o);
  if(o.app==='healthtracker') next=o.data;
  else if(o.profile && ('calorieTraining' in o.profile || o.mealSets)) next=fromManus(o);
  else throw new Error('このアプリのバックアップでもManusの書き出しでもありません');
  const n=`食事 ${next.meals.length}件 / 体重 ${next.weights.length}件 / 目標モード ${Object.keys(next.training).length}日 / プリセット ${next.presets.length}件 / セット ${next.sets.length}件`;
  if(!confirm(`${n}\n\nを読み込みます。今のデータは置き換わります。よろしいですか？`)) return;
  localStorage.setItem(KEY, JSON.stringify(next));
  db=load(); save();
  toast('読み込みました'); render();
}
// 筋トレAIコーチのバックアップから体組成（体重・体脂肪率）だけを取り込む。既存の体重は上書きしない
function importCoachBody(o){
  let logs=[];
  try{ logs=JSON.parse(o.data&&o.data.wac_body||'[]'); }catch(e){}
  if(!logs.length) throw new Error('このバックアップには体組成の記録がありません');
  let addW=0, addF=0;
  for(const b of logs){
    if(!b.date) continue;
    const kg=b.weight!=null&&b.weight!==''?num(b.weight,null):null, fat=b.fat!=null&&b.fat!==''?num(b.fat,null):null;
    let ex=db.weights.find(w=>w.date===b.date);
    if(!ex){ if(kg==null&&fat==null) continue; db.weights.push({date:b.date,kg,fat}); if(kg!=null) addW++; if(fat!=null) addF++; continue; }
    if(ex.kg==null&&kg!=null){ ex.kg=kg; addW++; }
    if(ex.fat==null&&fat!=null){ ex.fat=fat; addF++; }
  }
  if(!confirm(`筋トレAIコーチの体組成 ${logs.length}件から、体重 ${addW}件・体脂肪率 ${addF}件を追加します。\n（すでに記録がある日の体重は上書きしません）`)){ db=load(); return; }
  save(); toast('体組成を取り込みました'); render();
}
function exportData(){
  db.meta.lastBackup=new Date().toISOString(); save();
  const blob=new Blob([JSON.stringify({app:'healthtracker', version:1, exportedAt:db.meta.lastBackup, data:db})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`healthtracker-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('書き出しました'); render();
}

// ===== イベント =====
document.addEventListener('click', async e=>{
  const el=e.target.closest('[data-a]'); if(!el || el.tagName==='INPUT') return;
  const a=el.dataset.a, v=el.dataset.v, id=el.dataset.id;
  switch(a){
    case 'tab': state.tab=v; state.trainerOpen=false; window.scrollTo(0,0); render(); break;
    case 'closeSheet': closeSheet(); break;
    // Today
    case 'setType': db.training[state.date]= db.training[state.date]===v? undefined : v; if(!db.training[state.date]) delete db.training[state.date]; save(); render(); break;
    case 'shiftDate': state.date=addDays(state.date, +v); state.trainerOpen=false; render(); break;
    case 'goToday': state.date=todayStr(); render(); break;
    case 'addMeal': openAddMeal(); break;
    case 'editMeal': openMealEdit(id); break;
    case 'delMeal': { const m=db.meals.find(x=>x.id===id); if(m && confirm(`「${m.name}」を削除しますか？`)){ db.meals=db.meals.filter(x=>x.id!==id); save(); render(); toast('削除しました'); } break; }
    case 'mealToPreset': { const m=db.meals.find(x=>x.id===id); if(m) openPresetEdit(null,{name:m.name.replace(/\s×\s[\d.]+(\s\(.*\))?$/,''), unitLabel:'1食', kcal:m.kcal, p:m.p, f:m.f, c:m.c, category:m.supp?'サプリ':'市販', inc:m.inc}); break; }
    case 'saveSet': openSaveSet(); break;
    case 'toggleTrainer': state.trainerOpen=!state.trainerOpen; render(); break;
    case 'copyTrainer': toast(await copyText(trainerPrompt(state.date))?'コピーしました。Claudeに貼り付けて送信してください':'コピーできませんでした'); break;
    case 'saveTrainer': { let t=document.getElementById('trainerReply').value.trim().replace(/^```\w*\n?|```$/g,'').trim(); if(!t){ toast('回答を貼り付けてください'); break; } db.comments[state.date]={text:t, at:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}; save(); state.trainerOpen=false; render(); break; }
    // 体重
    case 'saveWeight': {
      const d=document.getElementById('wDate').value||todayStr();
      const kgRaw=document.getElementById('wKg').value.trim(), fatRaw=document.getElementById('wFat').value.trim();
      const kg=kgRaw?num(kgRaw,NaN):null, fat=fatRaw?num(fatRaw,NaN):null;
      if(kg==null&&fat==null){ toast('体重か体脂肪率を入力してください'); break; }
      if(kg!=null&&!(kg>20&&kg<300)){ toast('正しい体重を入力してください'); break; }
      if(fat!=null&&!(fat>2&&fat<60)){ toast('正しい体脂肪率を入力してください'); break; }
      const ex=db.weights.find(w=>w.date===d);
      if(ex){ ex.kg=kg!=null?r1(kg):null; ex.fat=fat!=null?r1(fat):null; } else db.weights.push({date:d,kg:kg!=null?r1(kg):null,fat:fat!=null?r1(fat):null});
      save(); state.wDate=todayStr(); render(); toast(ex?'記録を更新しました':'記録しました'); break;
    }
    case 'editWeight': state.wDate=v; render(); window.scrollTo(0,0); document.getElementById('wKg').focus(); break;
    case 'delWeight': if(confirm(`${jpDate(v)} の記録を削除しますか？`)){ db.weights=db.weights.filter(w=>w.date!==v); save(); render(); } break;
    case 'wRange': state.wRange=+v; render(); break;
    case 'wAll': state.wAll=true; render(); break;
    case 'hcPaste': openHealthPaste(); break;
    case 'doHcImport': { const rows=parseBodyRows(document.getElementById('hcText').value); if(!rows.length){ toast('日付と数値を読み取れませんでした'); break; } const {add,upd,same}=applyBodyRows(rows); closeSheet(); render(); toast(`追加${add}件 / 更新${upd}件${same?` / 変更なし${same}件`:''}`); break; }
    // 食事タブ
    case 'foodTab': state.foodTab=v; render(); break;
    case 'foodCat': state.foodCat=v; render(); break;
    case 'newPreset': openPresetEdit(null,{category:state.foodCat==='すべて'?'食材':state.foodCat, inc:true}); break;
    case 'editPreset': openPresetEdit(id); break;
    case 'movePreset': { const list=presetsSorted().filter(p=>p.category===state.foodCat); const i=list.findIndex(p=>p.id===id), j=i+(+v); if(j<0||j>=list.length) break; [list[i],list[j]]=[list[j],list[i]]; list.forEach((p,k)=>p.order=k); save(); render(); break; }
    case 'editSet': openSetEdit(id); break;
    // 設定
    case 'saveProfile': {
      const p=db.profile; p.heightCm=num(document.getElementById('pH').value,p.heightCm); p.weightGoalKg=num(document.getElementById('pG').value,p.weightGoalKg); p.bfGoalPct=num(document.getElementById('pB').value,p.bfGoalPct);
      const bad=[];
      for(const k of TYPE_KEYS){ p.kcal[k]=num(document.getElementById('k_'+k).value,p.kcal[k]); const r={p:num(document.getElementById('p_'+k).value),f:num(document.getElementById('f_'+k).value),c:num(document.getElementById('c_'+k).value)}; if(r.p+r.f+r.c!==100) bad.push(TYPES[k].short); p.pfc[k]=r; }
      save(); render(); toast(bad.length?`保存しました（${bad.join('・')}の比率が合計100%ではありません）`:'設定を保存しました'); break;
    }
    case 'exportData': exportData(); break;
    case 'resetAll': if(confirm('すべてのデータを消去します。先にバックアップを書き出しましたか？') && confirm('本当に消去しますか？元に戻せません。')){ localStorage.removeItem(KEY); db=load(); save(); render(); toast('消去しました'); } break;
    // シート：食事追加
    case 'shMode': syncSheetInputs(); sheet.mode=v; refreshSheet(true); break;
    case 'copyEstimate': { syncSheetInputs(); toast(await copyText(estimatePrompt(sheet.aiText.trim()))?'コピーしました。Claudeに貼り付けて送信してください':'コピーできませんでした'); break; }
    case 'parseEstimate': { syncSheetInputs(); try{ sheet.est=parseEstimate(sheet.reply); refreshSheet(); document.getElementById('estTop')?.scrollIntoView({behavior:'smooth',block:'start'}); }catch(err){ toast(err.message); } break; }
    case 'manualRow': syncSheetInputs(); sheet.est=[...(sheet.est||[]), {name:sheet.aiText.trim()||'', kcal:'',p:'',f:'',c:''}]; refreshSheet(); break;
    case 'estDel': syncSheetInputs(); sheet.est.splice(+v,1); refreshSheet(); break;
    case 'addEstimate': { syncSheetInputs(); const items=sheet.est.filter(e=>String(e.name).trim()&&num(e.kcal,NaN)>=0); if(!items.length){ toast('食品名とカロリーを入力してください'); break; } addMeals(items.map(e=>({...e,name:String(e.name).trim()})), sheet.timing); closeSheet(); render(); toast(`${items.length}品を記録しました`); break; }
    case 'shCat': syncSheetInputs(); sheet.cat=v; refreshSheet(); break;
    case 'togglePick': if(sheet.sel[id]) delete sheet.sel[id]; else sheet.sel[id]=1; document.getElementById('pickList').innerHTML=pickListHtml(); break;
    case 'qty': { const q=Math.round(((sheet.sel[id]||1)+(+v))*10)/10; if(q<=0) delete sheet.sel[id]; else sheet.sel[id]=q; document.getElementById('pickList').innerHTML=pickListHtml(); break; }
    case 'addPresets': { syncSheetInputs(); const items=Object.entries(sheet.sel).map(([pid,q])=>scaled(db.presets.find(p=>p.id===pid),q)).filter(Boolean); addMeals(items, sheet.timing); closeSheet(); render(); toast(`${items.length}品を記録しました`); break; }
    case 'applySet': { syncSheetInputs(); const s=db.sets.find(x=>x.id===id); addMeals(s.items, sheet.timing); closeSheet(); render(); toast(`${s.items.length}品を追加しました`); break; }
    // シート：編集
    case 'saveMealEdit': { const m=db.meals.find(x=>x.id===sheet.id); const name=document.getElementById('eName').value.trim(); const kcal=num(document.getElementById('e_kcal').value,NaN); if(!name||!(kcal>=0)){ toast('食品名とカロリーを正しく入力してください'); break; } Object.assign(m,{name,kcal,p:num(document.getElementById('e_p').value),f:num(document.getElementById('e_f').value),c:num(document.getElementById('e_c').value),timing:document.getElementById('shTiming').value,inc:document.getElementById('eInc').checked}); save(); closeSheet(); render(); toast('食事ログを更新しました'); break; }
    case 'savePreset': {
      const name=document.getElementById('fName').value.trim(), kcal=num(document.getElementById('f_kcal').value,NaN);
      if(!name||!(kcal>=0)){ toast('食品名とkcalは必須です'); break; }
      const cat=document.getElementById('fCat').value;
      const data={name, unitLabel:document.getElementById('fUnit').value.trim(), unitG:num(document.getElementById('fUnitG').value,null), kcal, p:num(document.getElementById('f_p').value), f:num(document.getElementById('f_f').value), c:num(document.getElementById('f_c').value), category:cat, supp:cat==='サプリ', inc:document.getElementById('fInc').checked};
      if(sheet.id) Object.assign(db.presets.find(p=>p.id===sheet.id), data);
      else db.presets.push({id:uid(), order:Math.max(-1,...db.presets.filter(p=>p.category===cat).map(p=>p.order??0))+1, ...data});
      save(); closeSheet(); render(); toast(sheet.id?'更新しました':'プリセットに保存しました'); break;
    }
    case 'delPreset': { const p=db.presets.find(x=>x.id===sheet.id); if(confirm(`「${p.name}」を削除しますか？`)){ db.presets=db.presets.filter(x=>x.id!==sheet.id); save(); closeSheet(); render(); toast('削除しました'); } break; }
    case 'setSel': syncSheetInputs(); sheet.sel[id]=!sheet.sel[id]; refreshSheet(); break;
    case 'setSelAll': syncSheetInputs(); for(const k in sheet.sel) sheet.sel[k]=v==='1'; refreshSheet(); break;
    case 'doSaveSet': { syncSheetInputs(); if(!sheet.name.trim()){ toast('セット名を入力してください'); break; } const items=mealsOn(state.date).filter(m=>sheet.sel[m.id]).map(({name,kcal,p,f,c,supp,inc})=>({name,kcal,p,f,c,supp,inc})); db.sets.push({id:uid(), name:sheet.name.trim(), memo:'', items}); save(); closeSheet(); render(); toast('セットを保存しました'); break; }
    case 'renameSet': { const n=document.getElementById('setName').value.trim(); if(!n) break; db.sets.find(s=>s.id===sheet.id).name=n; save(); refreshSheet(); render(); toast('セット名を更新しました'); break; }
    case 'setItemMove': { const s=db.sets.find(x=>x.id===sheet.id), i=+v, j=i+(+el.dataset.d); if(j<0||j>=s.items.length) break; [s.items[i],s.items[j]]=[s.items[j],s.items[i]]; save(); refreshSheet(); break; }
    case 'setItemDel': { const s=db.sets.find(x=>x.id===sheet.id); s.items.splice(+v,1); save(); refreshSheet(); render(); toast('アイテムを削除しました'); break; }
    case 'setAddOpen': sheet.adding=true; refreshSheet(); break;
    case 'setAddClose': sheet.adding=false; refreshSheet(); break;
    case 'setAddPreset': { const s=db.sets.find(x=>x.id===sheet.id); s.items.push(scaled(db.presets.find(p=>p.id===id),1)); save(); sheet.q=document.getElementById('setQ').value; refreshSheet(); render(); toast('追加しました'); break; }
    case 'setAddManual': { const n=document.getElementById('mName').value.trim(), k=num(document.getElementById('m_kcal').value,NaN); if(!n||!(k>=0)){ toast('食品名とkcalは必須です'); break; } const s=db.sets.find(x=>x.id===sheet.id); s.items.push({name:n,kcal:k,p:num(document.getElementById('m_p').value),f:num(document.getElementById('m_f').value),c:num(document.getElementById('m_c').value),supp:false,inc:true}); save(); refreshSheet(); render(); toast('追加しました'); break; }
    case 'delSet': { const s=db.sets.find(x=>x.id===sheet.id); if(confirm(`「${s.name}」を削除しますか？`)){ db.sets=db.sets.filter(x=>x.id!==sheet.id); save(); closeSheet(); render(); toast('セットを削除しました'); } break; }
  }
});
// シート内の入力値を状態へ退避（再描画で消えないように）
function syncSheetInputs(){
  const g=id=>document.getElementById(id);
  if(g('shTiming')) sheet.timing=g('shTiming').value;
  if(g('aiText')) sheet.aiText=g('aiText').value;
  if(g('aiReply')) sheet.reply=g('aiReply').value;
  if(g('pq')) sheet.q=g('pq').value;
  if(g('sName')) sheet.name=g('sName').value;
  document.querySelectorAll('[data-est]').forEach(inp=>{ const e=sheet.est[+inp.dataset.est]; if(e) e[inp.dataset.k]=inp.value; });
}
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='pq' || t.id==='setQ'){ if(!e.isComposing) searchUpdate(t); return; }
  if(t.dataset.a==='pfcSum'){ const k=t.dataset.v; document.getElementById('sum_'+k).innerHTML=pfcSumText(k,num(document.getElementById('p_'+k).value),num(document.getElementById('f_'+k).value),num(document.getElementById('c_'+k).value),num(document.getElementById('k_'+k).value)); }
  if(t.dataset.est!==undefined && sheet.est){ sheet.est[+t.dataset.est][t.dataset.k]=t.value; }
  if(t.id==='wDate'){ state.wDate=t.value; const r=db.weights.find(w=>w.date===t.value); document.getElementById('wKg').value=r&&r.kg!=null?r.kg:''; document.getElementById('wFat').value=r&&r.fat!=null?r.fat:''; }
});
// 検索欄は一覧だけ差し替える（日本語入力の変換中は待つ）
function searchUpdate(t){
  sheet.q=t.value;
  if(t.id==='pq') document.getElementById('pickList').innerHTML=pickListHtml();
  else document.getElementById('setPickList').innerHTML=setPickListHtml();
}
document.addEventListener('compositionend', e=>{ if(e.target.id==='pq'||e.target.id==='setQ') searchUpdate(e.target); });
document.addEventListener('change', e=>{
  if(e.target.id==='importFile'){ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ importJson(rd.result); }catch(err){ alert('読み込めませんでした：'+err.message); } e.target.value=''; }; rd.readAsText(f); }
  if(e.target.id==='shTiming') sheet.timing=e.target.value;
});
document.getElementById('sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
// 日付が変わったら Today を今日に戻す
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.lastDay!==todayStr()){ state.lastDay=todayStr(); state.date=todayStr(); render(); } });
state.lastDay=todayStr();
importFromHash();
render();
window.addEventListener('hashchange', ()=>{ importFromHash(); render(); });
